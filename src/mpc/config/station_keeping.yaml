ros_topic:
    path_topic: "/planning/path"
    pose_topic: "/wamv/sensors/position/ground_truth_odometry"
    # pose_topic: "/gt_pose"
    # pose_topic: "/wamv/inekf_odom_correction/pose"

parameters:
    goal_tol: 1.0           # m
    v_surge: 0.5            # m/s
    yaw_rate: 0.1           # rad/s
    max_thrust: 50.0       # N
    min_thrust: -26.0      # N

# mpc cost funtion for zigzag and circling
    # MPC cost matrices
    # [0:3] is angle: roll, pitch, yaw ,
    # [3:6] is position: x, y, z
    # [6:9] is angular velocity: roll, pitch, yaw,
    # [9:12] is linear velocity: surge (Vx), sway (Vy), heave (Vz),
cost:
    P: [1e-5, 1e-5, 50, 30, 30, 1e-5, 1e-5, 1e-5, 1e-5, 1e-3, 1e-5, 1e-5]
    Q: [1e-5, 1e-5, 50, 30, 30, 1e-5, 1e-5, 1e-5, 1e-5, 1e-3, 1e-5, 1e-5]
    R: [[1e-5, 0], [0, 1e-5]]
    P_scale: 1
    Q_scale: 10

horizon:
    dt: 0.04
    Nt: 100
    Nsim: 1100      # (40 + dt * Nt) / dt
